<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BoomVoyage — fireworks from the world's waterfronts</title>
  <meta name="description" content="A fireworks show every two minutes, drawn and sounded live in your browser. Pick a city and watch.">
  <meta name="theme-color" content="#04050f">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2304050f'/%3E%3Cg stroke='%23ffcf8a' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M16 5v6M16 21v6M5 16h6M21 16h6M8.5 8.5l4 4M19.5 19.5l4 4M23.5 8.5l-4 4M12.5 19.5l-4 4'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="stage" role="img" aria-label="Night scene with fireworks"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <div id="ui" class="ui is-hidden">
    <header class="top">
      <div class="brand">
        <span class="brand-name">Boom<em>Voyage</em></span>
        <span class="brand-tag">Fireworks from the world's waterfronts</span>
      </div>

      <div class="switcher">
        <button id="sceneBtn" class="scene-btn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="sceneMenu">
          <span class="pin" aria-hidden="true"></span>
          <span id="sceneLabel">Loading</span>
          <svg class="chev" viewBox="0 0 12 8" width="12" height="8" aria-hidden="true"><path d="M1 1.5l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <ul id="sceneMenu" class="scene-menu" role="listbox" aria-label="Choose a place" hidden></ul>
      </div>
    </header>

    <div id="showTitle" class="show-title" aria-live="polite"></div>

    <footer class="bottom">
      <div class="clock">
        <span id="clockLabel" class="label">Next show in</span>
        <span id="countdown" class="time">2:00</span>
        <span class="bar" aria-hidden="true"><i id="barFill"></i></span>
      </div>

      <div class="controls">
        <button id="shareBtn" class="icon" type="button" aria-label="Copy link to this show" title="Copy link to this show">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M10.2 13.8a3.6 3.6 0 005.1 0l3-3a3.6 3.6 0 00-5.1-5.1l-1.1 1.1M13.8 10.2a3.6 3.6 0 00-5.1 0l-3 3a3.6 3.6 0 005.1 5.1l1.1-1.1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="ambientBtn" class="icon" type="button" aria-pressed="false" aria-label="Ambient mode: hide everything but the show" title="Ambient mode (A)">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="3.5" y="5" width="17" height="11.5" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M9 20h6M12 16.5V20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <button id="launchBtn" class="pill" type="button">Launch now</button>
        <button id="muteBtn" class="icon" type="button" aria-pressed="false" aria-label="Mute sound" title="Mute (M)">
          <svg class="i-on" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4.2 4.2 0 010 6M18 6.5a7.8 7.8 0 010 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <svg class="i-off" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9.5l5 5M20.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <button id="fsBtn" class="icon" type="button" aria-label="Fullscreen" title="Fullscreen (F)">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 9.5V5h4.5M14.5 5H19v4.5M19 14.5V19h-4.5M9.5 19H5v-4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </footer>
  </div>

  <!-- Quiet messages that float above the controls. -->
  <div id="float" class="float">
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="linkBox" class="link-box" role="group" aria-labelledby="linkHelp" hidden>
      <label id="linkHelp" for="linkField">Copy this link to share the show</label>
      <input id="linkField" type="text" readonly spellcheck="false" autocomplete="off">
      <button id="linkDone" class="pill" type="button">Done</button>
    </div>
    <!-- The name of the act that is playing. Decoration only, so it is hidden from screen readers. -->
    <div id="actCaption" class="act-caption" aria-hidden="true">
      <small id="actNum"></small>
      <span id="actName"></span>
    </div>
  </div>

  <div id="start" class="start">
    <button id="startBtn" class="start-inner" type="button">
      <span id="startKicker" class="start-kicker">A fireworks voyage</span>
      <span class="start-name">Boom<em>Voyage</em></span>
      <span id="startPlace" class="start-place">Tonight and every two minutes.</span>
      <span class="start-cta"><span class="ring" aria-hidden="true"></span>Tap to start</span>
      <span id="startNote" class="start-note">Sound is on. You can mute it at any time.</span>
    </button>
  </div>

  <noscript><p class="noscript">BoomVoyage needs JavaScript to draw the fireworks.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
